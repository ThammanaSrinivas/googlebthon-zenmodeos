# base - applies to every project.
#
# Vendored into .guardrails/presets/ by install.py and overwritten on upgrade: don't
# edit the vendored copy. Change behaviour from .guardrails/guardrails.toml instead
# (disable = [...], [override.<id>], or your own [[rule]] with the same id).
#
# Every rule carries micro-context: `why` (the reason it exists) and `fix` (what to
# do instead). That text is exactly what Claude reads at the moment a hook blocks
# it, so it is written as instructions. `bad` / `good` are executable examples:
# `gr test` fails if a rule stops catching its bad examples or starts catching its
# good ones. "{{}}" inside an example is removed before testing; it splits
# secret-shaped strings so this file doesn't trip secret scanners.

[settings]
exclude = [
  ".git/**", ".guardrails/**", "**/node_modules/**", "**/build/**", "**/dist/**", "**/out/**",
  "**/.gradle/**", "**/vendor/**", "**/__pycache__/**", "**/.venv/**", "**/venv/**",
  "**/.next/**", "**/target/**", "**/coverage/**", "*.min.js", "*.min.css", "*.map", "*.lock",
  "package-lock.json", "pnpm-lock.yaml",
]
# Where a real secret is *supposed* to live (gitignored). Writing one here is fine.
secret_files = [".env", ".env.*", "!.env.example", "!.env.sample", "!.env.template", "!.env.dist"]
protected_branches = ["main", "master"]

# ─────────────────────────────────────────────────────────────────────────────
# Destructive git
# ─────────────────────────────────────────────────────────────────────────────

[[rule]]
id = "git-force-push"
kind = "command"
regex = '\bgit\b[^;&|\n]*\bpush\b[^;&|\n]*(\s(--force|--force-with-lease|--force-if-includes|--mirror|-[a-zA-Z]*f[a-zA-Z]*)(=\S*)?(\s|$)|\s\+[^\s+])'
why = "Force-pushing rewrites history on the remote and can silently delete commits that teammates, CI or another agent already built on."
fix = "Push without force. If the remote rejects the push, fetch and merge (or rebase your local, unpushed commits), then push normally. If history really must be rewritten, stop and ask the user - they run it themselves."
bad = ["git push --force", "git push -f origin main", "git -C repo push --force-with-lease", "git push origin +main", "bash -c 'git push -uf origin x'"]
good = ["git push", "git push -u origin feature/x", "git push --follow-tags", 'git commit -m "docs: never git push --force"']

[[rule]]
id = "git-reset-hard"
kind = "command"
regex = '\bgit\b[^;&|\n]*\breset\b[^;&|\n]*\s--(hard|merge|keep)\b'
why = "`git reset --hard` throws away uncommitted work with no undo - including changes the user made that you never saw."
fix = "To set work aside use `git stash`; to undo one file the user asked about use `git restore <file>`; to move a branch pointer use `git reset --soft`. Never discard the working tree wholesale."
bad = ["git reset --hard", "git reset --hard HEAD~1", "git -C x reset --hard origin/main"]
good = ["git reset --soft HEAD~1", "git reset HEAD file.txt", "git stash"]

[[rule]]
id = "git-amend"
kind = "command"
regex = '\bgit\b[^;&|\n]*\bcommit\b[^;&|\n]*\s--amend\b'
why = "Amending rewrites the previous commit: if it was pushed that's a history rewrite, and after a failed pre-commit hook it silently folds your changes into someone else's commit."
fix = "Make a new commit instead. If the user explicitly asked for an amend, tell them the guardrail blocked it so they can run it themselves."
bad = ["git commit --amend", "git commit --amend --no-edit", "git commit -a --amend -m x"]
good = ["git commit -m 'fix: amend the docs'", "git commit"]

[[rule]]
id = "git-clean-force"
kind = "command"
regex = '\bgit\b[^;&|\n]*\bclean\b[^;&|\n]*\s(-[a-zA-Z]*f|--force)'
why = "`git clean -f` permanently deletes untracked files - new work that was never committed, local config, notes."
fix = "Run `git clean -n` to show what would go and ask the user; delete specific build artifacts by name if that's the goal."
bad = ["git clean -fd", "git clean -xdf", "git clean --force"]
good = ["git clean -n", "git clean --dry-run"]

[[rule]]
id = "git-branch-force-delete"
kind = "command"
regex = '\bgit\b[^;&|\n]*\bbranch\b[^;&|\n]*\s(-[a-zA-Z]*D[a-zA-Z]*|--delete\s+--force|--force\s+--delete)(\s|$)'
why = "`git branch -D` deletes a branch even if its commits exist nowhere else."
fix = "Use `git branch -d <name>`: it refuses when the branch has unmerged work, which is exactly the case worth asking the user about."
bad = ["git branch -D feature", "git branch --delete --force x"]
good = ["git branch -d feature", "git branch -a", "git branch --show-current"]

[[rule]]
id = "git-discard-all"
kind = "command"
regex = '\bgit\b(?![^;&|\n]*--staged)[^;&|\n]*\b(checkout|restore)\b[^;&|\n]*\s(--\s+)?\.(\s|$)|\bgit\b[^;&|\n]*\bstash\s+(drop|clear)\b'
why = "Discarding every change in the tree (or dropping stashes) destroys uncommitted work - often the user's, not yours."
fix = "Revert only the specific files you changed and the user wants reverted: `git restore path/to/file`. Leave stashes alone."
bad = ["git checkout .", "git checkout -- .", "git restore .", "git stash drop", "git stash clear"]
good = ["git restore src/app.ts", "git restore --staged .", "git checkout -b feature", "git stash list"]

[[rule]]
id = "git-skip-hooks"
kind = "command"
regex = '--no-verify\b|\bgit\b[^;&|\n]*\bcommit\b[^;&|\n]*\s-[a-zA-Z]*n[a-zA-Z]*(\s|$)|\bcore\.hooksPath(=|\s+[^\s;&|-])|--unset[^;&|\n]*\bcore\.hooksPath\b|\bHUSKY=0\b|\bSKIP_HOOKS?=\S'
why = "Git hooks are where these guardrails run at commit time; skipping or re-pointing them ships exactly what they exist to stop."
fix = "Let the hook run and fix what it reports - its output says what and how. If it is wrong, stop and tell the user which check failed. To (re)wire hooks, run `.guardrails/gr setup`."
bad = ["git commit --no-verify -m x", "git commit -n -m x", "git push --no-verify", "git -c core.hooksPath=/dev/null commit -m x", "git config core.hooksPath /tmp", "git config --unset core.hooksPath", "HUSKY=0 git commit -m x"]
good = ["git commit -m 'x'", "git config --get core.hooksPath", 'git commit -m "explain why --no-verify is banned"', "git commit --no-edit"]

[[rule]]
id = "git-history-rewrite"
kind = "command"
regex = '\bgit\b[^;&|\n]*\b(filter-branch|filter-repo|replace)\b|\bgit\b[^;&|\n]*\breflog\s+(expire|delete)\b|\bgit\b[^;&|\n]*\bupdate-ref\s+-d\b|\bgit\b[^;&|\n]*\bgc\b[^;&|\n]*--prune=now'
why = "These rewrite or permanently prune repository history; mistakes are unrecoverable once the reflog is gone."
fix = "Stop and describe to the user what you want to change in history and why. If it's removing a leaked secret, the secret must be rotated anyway - history rewriting alone doesn't un-leak it."
bad = ["git filter-branch --tree-filter x", "git filter-repo --path secrets", "git reflog expire --all", "git gc --prune=now"]
good = ["git gc", "git reflog"]

[[rule]]
id = "git-add-force"
kind = "command"
regex = '\bgit\b[^;&|\n]*\badd\b[^;&|\n]*\s(-[a-zA-Z]*f[a-zA-Z]*|--force)(\s|$)'
why = "Gitignored files are usually secrets (.env, keystores) or build output. `git add -f` is how they leak into history, where they stay even after deletion."
fix = "Don't force-add. If the file genuinely belongs in git, ask the user to change .gitignore."
bad = ["git add -f .env", "git add --force build/out.js"]
good = ["git add src/", "git add -A", "git add -p"]

[[rule]]
id = "push-protected-branch"
kind = "git_push_branch"
action = "ask"
why = "A direct push to a protected branch skips review and CI gating, and everyone pulls it immediately."
fix = "Push a feature branch and open a pull request. If the user wants the direct push, they confirm it."
bad = ["git push origin main", "git push origin HEAD:master", "git push origin feature:main", "git push origin :main"]
good = ["git push origin feature/x", "git push -u origin fix-123"]

# ─────────────────────────────────────────────────────────────────────────────
# Destructive or risky shell
# ─────────────────────────────────────────────────────────────────────────────

[[rule]]
id = "rm-dangerous"
kind = "command"
regex = '(^|[\s;&|(])rm(?=\s)(?=[^;&|\n]*(\s-[a-zA-Z]*[rR]|\s--recursive))[^;&|\n]*\s(/|/\*|~/?\*?|\$HOME/?\*?|\$\{HOME\}/?\*?|\.{1,2}/?\*?|\*|/[a-z]+/?|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?/\*?)(\s|$|[;&|)])|--no-preserve-root'
why = "Recursive deletes of /, ~, the current directory, a bare glob, or `$VAR/` (which becomes `/` when VAR is empty) wipe far more than intended, with no undo."
fix = "Delete the specific path you mean (`rm -rf ./build`). In scripts, guard variables: `rm -rf \"${DIR:?}/\"`. If you need to clear the working directory, ask the user first."
bad = ["rm -rf /", "rm -rf ~", "sudo rm -rf /*", "rm -rf .", "rm -r -f *", "rm -rf $BUILD_DIR/", "rm -fr ../", "rm -rf /usr", "rm --no-preserve-root -rf /"]
good = ["rm -rf ./build", "rm -rf node_modules dist", "rm -rf ${DIR:?}/cache", "rm file.txt", "rm -rf /tmp/claude-scratch/x"]

[[rule]]
id = "disk-destroy"
kind = "command"
regex = '(^|[\s;&|(])(mkfs(\.\w+)?|wipefs|shred)\s|\bdd\b[^;&|\n]*\bof=/dev/(?!null\b|zero\b|stdout\b|stderr\b)|>\s*/dev/(sd|nvme|hd|vd|xvd|disk|mmcblk)\w*'
why = "These overwrite disks or filesystems directly; one wrong device name destroys the machine's data."
fix = "Don't run raw disk operations. Describe what you need to the user; they run it after checking the device name."
bad = ["mkfs.ext4 /dev/sdb1", "dd if=x.img of=/dev/sda bs=4M", "shred -u secrets.txt", "cat x > /dev/nvme0n1"]
good = ["dd if=/dev/zero of=test.img bs=1M count=1", "echo hi > /dev/null"]

[[rule]]
id = "chmod-world-writable"
kind = "command"
regex = '\bchmod\b[^;&|\n]*\s(0?777|a\+rwx|ugo\+rwx|o\+w)(\s|$)'
why = "World-writable files and directories let any process or user modify them. It is never the right fix for a permissions error."
fix = "Grant the minimum: `chmod u+x script.sh` for an executable, `chmod 644`/`755` for normal files/dirs. If ownership is wrong, tell the user."
bad = ["chmod 777 run.sh", "chmod -R 777 .", "chmod a+rwx data"]
good = ["chmod +x run.sh", "chmod 755 bin", "chmod 600 key"]

[[rule]]
id = "pipe-to-shell"
kind = "command"
regex = '\b(curl|wget|fetch)\b[^;&\n]*\|\s*(sudo\s+)?(env\s+\S+\s+)?((ba|z|da|k|fi)?sh|python3?|node|perl|ruby)\b|\b((ba|z)?sh|source)\s+<\(\s*(curl|wget)'
why = "Piping a download straight into an interpreter runs code nobody has read, from a URL whose content can change between runs - the classic supply-chain foothold."
fix = "Download to a file, check what it does (or verify a checksum/signature), and run it only with the user's OK. Prefer the package manager."
bad = ["curl -fsSL https://x.sh | sh", "curl -s https://x | sudo bash", "wget -qO- https://x | python3", "bash <(curl -s https://x)"]
good = ["curl -fsSLo install.sh https://x.sh", "curl -s https://api.x/v1 | jq .name"]

[[rule]]
id = "sudo"
kind = "command"
action = "ask"
regex = '(^|[;&|(]\s*|\bxargs\s+)sudo\s'
why = "Root-level changes reach outside the project, affect the whole machine and are hard to undo."
fix = "Prefer a user-level install (a virtualenv, npx, --user, a project-local toolchain). If root is really needed, the user confirms."
bad = ["sudo apt install x", "ls | xargs sudo rm", "cd x && sudo make install"]
good = ["echo 'run sudo yourself'", "apt list --installed"]

[[rule]]
id = "publish-package"
kind = "command"
action = "ask"
regex = '\b(npm|yarn|pnpm|bun)\s+publish\b|\btwine\s+upload\b|\bcargo\s+publish\b|\bgem\s+push\b|\bpoetry\s+publish\b|\bdocker\s+push\b|\bflutter\s+pub\s+publish\b'
why = "Publishing is public and effectively permanent: registries don't let you take a version back, and users install it immediately."
fix = "Prepare everything (version bump, changelog, build) and let the user run the publish, or confirm it explicitly."
bad = ["npm publish", "pnpm publish --access public", "twine upload dist/*", "docker push org/app:1.2"]
good = ["npm pack", "npm run build", "docker build -t app ."]

[[rule]]
id = "deploy-or-destroy-infra"
kind = "command"
action = "ask"
regex = '\bterraform\s+(apply|destroy)\b|\bpulumi\s+(up|destroy)\b|\bkubectl\s+(apply|delete|replace|scale|drain|patch)\b|\bhelm\s+(install|upgrade|uninstall|delete|rollback)\b|\bfirebase\s+(deploy|firestore:delete|database:remove|hosting:disable)\b|\bgcloud\b[^;&|\n]*\s(deploy|delete)\b|\baws\b[^;&|\n]*\s(delete-\S+|terminate-\S+|rb|rm)\b|\bvercel\b[^;&|\n]*--prod\b|\bwrangler\s+(deploy|delete)\b|\bfly(ctl)?\s+(deploy|destroy)\b|\bheroku\b[^;&|\n]*\bdestroy\b|\bfastlane\b[^;&|\n]*\b(release|deploy|supply|deliver|upload|beta|production)\b'
why = "This changes or deletes live infrastructure that real users depend on."
fix = "Show the user the plan or diff (`terraform plan`, `kubectl diff`, a dry-run) and let them run the apply/deploy, or confirm it explicitly."
bad = ["terraform apply -auto-approve", "kubectl delete ns prod", "firebase deploy --only functions", "gcloud run deploy api", "aws s3 rb s3://bucket --force"]
good = ["terraform plan", "kubectl get pods", "firebase emulators:start", "gcloud config list"]

[[rule]]
id = "github-destructive"
kind = "command"
action = "ask"
regex = '\bgh\s+(repo\s+(delete|archive|rename|edit)|release\s+(create|delete|upload|edit)|pr\s+merge|secret\s+(set|delete|remove)|variable\s+(set|delete)|api\b[^;&|\n]*(-X|--method)\s*(DELETE|PUT|PATCH))\b'
why = "This acts on the shared GitHub repository - merges, releases, secrets, settings - in front of everyone, and some of it can't be undone."
fix = "Prepare it (draft the release notes, get the PR green) and let the user do the final action, or confirm it explicitly."
bad = ["gh pr merge 12 --squash", "gh repo delete org/x --yes", "gh release create v1.0", "gh secret set TOKEN", "gh api -X DELETE repos/o/r"]
good = ["gh pr view 12", "gh pr create --draft", "gh run list", "gh api repos/o/r"]

[[rule]]
id = "sql-destructive"
kind = "command"
action = "ask"
scope = "raw"
regex = '''(?i)\b(drop\s+(table|database|schema|collection)|truncate\s+table|delete\s+from\s+[\w."`]+\s*(;|$|["']))|\balter\s+table\s+\S+\s+drop\s'''
why = "Dropping tables or deleting without a WHERE clause destroys data; against a shared or production database it is an incident."
fix = "Use a migration the user reviews, add a WHERE clause, or run it against a local/test database. If it must run here, the user confirms."
bad = ["psql -c 'DROP TABLE users;'", "mysql -e \"delete from orders;\"", "sqlite3 db 'TRUNCATE TABLE x'"]
good = ["psql -c 'SELECT count(*) FROM users'", "psql -c \"DELETE FROM sessions WHERE expires < now()\""]

[[rule]]
id = "guardrails-tamper"
kind = "command"
regex = '\bGUARDRAILS_UNLOCK\b|\bdisableAllHooks\b|--dangerously-skip-permissions\b'
why = "These switch off the guardrails or the permission system for the session."
fix = "Leave guardrails on. If a rule blocks legitimate work, tell the user which rule; changing it is their call."
bad = ["GUARDRAILS_UNLOCK=1 .guardrails/gr baseline", "claude --dangerously-skip-permissions -p x"]
good = ["claude -p 'summarize'"]

# ─────────────────────────────────────────────────────────────────────────────
# Self-protection: the agent may not edit its own guardrails
# ─────────────────────────────────────────────────────────────────────────────

[[rule]]
id = "guardrails-self-protect"
kind = "protect_path"
paths = [
  ".guardrails/**", ".githooks/**", ".husky/**", ".pre-commit-config.yaml", "lefthook.yml",
  ".claude/settings.json", ".claude/settings.local.json", "~/.claude/settings.json",
  "~/.claude/settings.local.json", ".github/workflows/guardrails.yml",
]
why = "These files define the guardrails and the hooks that run them; an agent that can edit them can switch them off, even by accident."
fix = "Don't change guardrail, hook or Claude settings files. Tell the user what change you think is needed and why; they edit it themselves, or restart Claude Code with GUARDRAILS_UNLOCK=1 for a guardrail-maintenance session."
bad = [".guardrails/guardrails.toml", ".guardrails/baseline.json", ".githooks/pre-commit", ".claude/settings.json", "~/.claude/settings.json"]
good = ["src/app.ts", ".claude/agents/reviewer.md", ".github/workflows/ci.yml"]

# ─────────────────────────────────────────────────────────────────────────────
# Secrets: never read, never written into code or commands, never committed
# ─────────────────────────────────────────────────────────────────────────────

[[rule]]
id = "no-reading-secrets"
kind = "read_protect"
paths = [
  ".env", ".env.*", "!.env.example", "!.env.sample", "!.env.template", "!.env.dist",
  "*.pem", "*.key", "*.p12", "*.pfx", "*.keystore", "*.jks", "*.tfstate", "*.tfstate.*", "*.tfvars",
  "id_rsa", "id_rsa.*", "id_ed25519", "id_ed25519.*", "id_ecdsa", "id_ecdsa.*", "!*.pub",
  ".netrc", ".git-credentials", "*service-account*.json", "*serviceAccount*.json", "credentials.json",
  "~/.ssh/**", "!~/.ssh/*.pub", "!~/.ssh/known_hosts", "!~/.ssh/config",
  "~/.aws/credentials", "~/.config/gcloud/**", "~/.docker/config.json", "~/.kube/config",
  "~/.npmrc", "~/.pypirc", "~/.netrc", "~/.git-credentials", "~/.claude/.credentials.json",
]
why = "Whatever you read is sent into this conversation's transcript and logs. Secret values must never leave the file they live in."
fix = "Don't open it. To know which variables exist, read .env.example or the code that loads them; to use the values, run the program and let it load the file itself (`source .env && cmd`, docker --env-file). If you truly need a value, ask the user."
bad = [".env", "config/.env.production", "deploy/key.pem", "~/.ssh/id_ed25519", "app/release.keystore", "~/.aws/credentials"]
good = [".env.example", "src/env.ts", "~/.ssh/id_ed25519.pub", "~/.ssh/known_hosts", "docs/keys.md"]

[[rule]]
id = "no-secret-files-in-git"
kind = "forbidden_file"
paths = [
  ".env", ".env.*", "!.env.example", "!.env.sample", "!.env.template", "!.env.dist",
  "*.pem", "*.key", "*.p12", "*.pfx", "*.keystore", "*.jks", "*.tfstate", "*.tfstate.*",
  "id_rsa", "id_rsa.*", "id_ed25519", "id_ed25519.*", "id_ecdsa", "id_ecdsa.*", "!*.pub",
  ".netrc", ".git-credentials", "*service-account*.json", "*serviceAccount*.json",
]
why = "Once a secret file is committed it lives in git history forever - every clone and fork has it, even after the file is deleted."
fix = "Unstage it (`git rm --cached <file>`), make sure .gitignore covers it, and load it at runtime instead. If it was ever pushed, tell the user the secret needs rotating."
bad = [".env", "app/.env.local", "certs/server.pem", "android/app/upload.keystore", "terraform.tfstate"]
good = [".env.example", "id_ed25519.pub", "src/env.ts"]

[defaults.secret]
why = "A credential in source or on a command line ends up in git history, CI logs, shell history and this transcript - and stays there after it's deleted."
fix = "Read it from the environment (process.env.X, os.environ[\"X\"], BuildConfig / local.properties) and keep the real value in a gitignored file such as .env, with a placeholder in .env.example. If a real key was just exposed, tell the user it must be rotated."

[[rule]]
id = "secret-private-key"
kind = "secret"
regex = '-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY( BLOCK)?-----'
bad = ["-----BEGIN RSA PRIVATE{{}} KEY-----", "-----BEGIN OPENSSH PRIVATE{{}} KEY-----", "-----BEGIN PRIVATE{{}} KEY-----"]
good = ["-----BEGIN PUBLIC KEY-----", "-----BEGIN CERTIFICATE-----"]

[[rule]]
id = "secret-aws-access-key"
kind = "secret"
regex = '\b(AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'
bad = ["aws_access_key_id = AKIA{{}}IOSFODNN7EXAMPLE"]
good = ["AKIA_PREFIX_DOCS", "aws_access_key_id = ${AWS_ACCESS_KEY_ID}"]

[[rule]]
id = "secret-google-api-key"
kind = "secret"
regex = '\bAIza[0-9A-Za-z_\-]{35}\b'
bad = ["apiKey: 'AIza{{}}SyA1234567890abcdefghijklmnopqrstuv'"]
good = ["apiKey: process.env.GOOGLE_API_KEY"]

[[rule]]
id = "secret-github-token"
kind = "secret"
regex = '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b|\bgithub_pat_[A-Za-z0-9_]{50,}\b'
bad = ["token=ghp{{}}_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789", "github{{}}_pat_11ABCDEFG0123456789_abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJ"]
good = ["token=${GITHUB_TOKEN}", "ghp_ prefix means a personal token"]

[[rule]]
id = "secret-slack"
kind = "secret"
regex = '\bxox[baprse]-[A-Za-z0-9-]{10,}|https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'
bad = ["xox{{}}b-1234567890-abcdefghij", "https://hooks.slack.com/services/T0000{{}}0000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"]
good = ["SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}"]

[[rule]]
id = "secret-stripe-live"
kind = "secret"
regex = '\b(sk|rk)_live_[0-9a-zA-Z]{20,}\b'
bad = ["sk{{}}_live_4eC39HqLyjWDarjtT1zdp7dc"]
good = ["sk_test_placeholder", "STRIPE_KEY=sk_live_..."]

[[rule]]
id = "secret-llm-api-key"
kind = "secret"
regex = '\bsk-ant-[A-Za-z0-9_\-]{20,}|\bsk-(proj-|svcacct-|admin-)?(?!ant-)[A-Za-z0-9_\-]{32,}'
bad = ["ANTHROPIC_API_KEY=sk{{}}-ant-api03-abcdefghijklmnopqrstuvwxyz", "OPENAI_API_KEY=sk{{}}-proj-abcdefghijklmnopqrstuvwxyz0123456789"]
good = ["sk-learn is a library", "key = os.environ[\"ANTHROPIC_API_KEY\"]"]

[[rule]]
id = "secret-other-tokens"
kind = "secret"
regex = '\bSG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}\b|\bnpm_[A-Za-z0-9]{36}\b|\bglpat-[A-Za-z0-9_\-]{20}\b|\bhf_[A-Za-z0-9]{34}\b'
bad = ["SG{{}}.abcdefghijklmnopqrstuv.abcdefghijklmnopqrstuvwxyz0123456789ABCDEFG", "npm{{}}_abcdefghijklmnopqrstuvwxyz0123456789", "glpat{{}}-abcdefghij0123456789"]
good = ["npm_config_cache=/tmp/x"]

[[rule]]
id = "secret-url-credentials"
kind = "secret"
regex = '''\b[a-z][a-z0-9+.\-]*://[^/\s:@'"]+:(?!(password|passwd|pass|secret|changeme|xxx+|\*+|\$\{?\w+\}?|<[^>]*>)@)[^/\s:@'"]{6,}@[^\s'"]+'''
bad = ["DATABASE_URL=postgres://app:s3cr3tP4ss@db.internal:5432/app", "https://deploy:hunter2hunter2@git.example.com/x.git"]
good = ["postgres://user:password@localhost:5432/dev", "postgres://app:${DB_PASSWORD}@db:5432/app", "https://example.com/path@v1"]

[[rule]]
id = "secret-assignment"
kind = "secret"
regex = '''(?i)(?<![a-z0-9])(password|passwd|pwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|private[_-]?key)(?![a-z0-9])["']?\s*[:=]\s*["'](?!\$\{|\{\{|<|%|your|xxx|changeme|example|dummy|test|fake|placeholder|redacted|replace)[^"'\s]{12,}["']'''
bad = ["password = \"Tr0ub4dor&3xyz\"", "DB_PASSWORD=\"hunter2hunter2\"", "apiKey: 'q8Zr2LmP0vXy7Kd1'", "CLIENT_SECRET='9f8e7d6c5b4a3210ffee'"]
good = ["password = os.environ[\"DB_PASSWORD\"]", "PASSWORD_HASH = \"$2b$12$abcdefghijklmnop\"", "apiKey: 'your-api-key-here'", "secret: \"${SECRET}\"", "password = \"short\""]

# ─────────────────────────────────────────────────────────────────────────────
# Code health - stack-neutral
# ─────────────────────────────────────────────────────────────────────────────

[[rule]]
id = "max-file-lines"
kind = "max_lines"
max = 1000
paths = [
  "*.kt", "*.java", "*.scala", "*.swift", "*.m", "*.dart", "*.ts", "*.tsx", "*.js", "*.jsx", "*.mjs",
  "*.cjs", "*.vue", "*.svelte", "*.py", "*.rb", "*.php", "*.go", "*.rs", "*.cs", "*.c", "*.cc",
  "*.cpp", "*.h", "*.hpp", "*.ex", "*.exs",
]
why = "Files past ~1000 lines are hard for people and AI alike to hold in context; they become God-files every change collides in."
fix = "Split by responsibility: move a cohesive piece (a component, a helper group, a sub-feature) into its own file and import it. Don't squeeze code onto fewer lines or delete comments to get under the limit."

[[rule]]
id = "no-conflict-markers"
kind = "content"
paths = ["**"]
exclude = ["*.md", "*.rst", "*.txt", "*.diff", "*.patch"]
regex = '^(<{7}|>{7})( |$)'
why = "Leftover merge-conflict markers break the build or, worse, silently ship both sides of a conflict."
fix = "Resolve the conflict: keep the correct code from each side, delete every <<<<<<< / ======= / >>>>>>> line, then build and test."
bad = ["<<<<<<< HEAD", ">>>>>>> feature/x"]
good = ["// <<<<<< not a marker", "a <<<<<<<b"]

[[rule]]
id = "no-elided-code"
kind = "content"
paths = [
  "*.kt", "*.java", "*.swift", "*.dart", "*.ts", "*.tsx", "*.js", "*.jsx", "*.mjs", "*.vue", "*.svelte",
  "*.py", "*.rb", "*.php", "*.go", "*.rs", "*.cs", "*.c", "*.cc", "*.cpp", "*.h",
]
regex = '(?i)(//|#|/\*|<!--)\s*(\.\.\.\s*)?((rest|remainder) of (the )?(code|file|implementation|function|class|method|component)\s*(\.\.\.|unchanged|omitted|here|remains|stays|$|\*/|-->)|(existing|other|previous|remaining|original) (code|implementation|methods|logic|imports)\s*(\.\.\.|unchanged|omitted|here|goes here|remains|stays|$|\*/|-->)|(code|implementation) (unchanged|omitted)|\.\.\.\s*(unchanged|omitted)\b)'
why = "A placeholder like `// ... existing code ...` written into a real file replaces the code it stands for - the original is gone."
fix = "Write out the complete code. With the Edit tool, replace only the lines that change instead of rewriting the file with placeholders. If you lost the original, restore it from git (`git show HEAD:<path>`)."
bad = ["// ... existing code ...", "# rest of the implementation unchanged", "/* ... rest of the file ... */", "// existing code here", "// implementation omitted for brevity"]
good = ["// Existing users keep their settings", "# rest of the pipeline runs nightly"]

# One spelling per meaning. The rules themselves are per language (android: kotlin-duplicate-text,
# python: py-duplicate-text) since what counts as source and as a test differs; they share this text.
[defaults.duplicate_literal]
why = "The same text typed out three times drifts: one copy gets the fix, the others keep the old wording, key or URL - and renaming it becomes a grep-and-hope."
fix = "Name it once and use the name: a constant for a key, URL, MIME type or product name; for a message tied to an action (copying a code, a retry toast), move the action into one function that owns the text and call it. Don't dodge the check by splitting or reformatting the string."
ref = "The message lists every copy. Repeats that predate the rule are grandfathered by `gr baseline` (a human runs it): their count may fall, never grow."

[[rule]]
id = "max-file-size"
kind = "max_file_size"
max_kb = 2048
why = "Large files bloat every clone forever - git never forgets a blob, even after it's deleted."
fix = "Don't commit it. Generated or downloaded artifacts belong in .gitignore; large binaries belong in Git LFS or an artifact store. Ask the user which."
